name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Read app version
        id: version
        run: |
          version="$(sed -n 's/^dailyDiet\.versionName=//p' gradle.properties | head -n1 | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "::error::dailyDiet.versionName is missing from gradle.properties."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect debug artifacts
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/DailyDiet-${APP_VERSION}-debug.apk"
          cd dist
          md5sum DailyDiet-*.apk > checksums-md5.txt
          sha1sum DailyDiet-*.apk > checksums-sha1.txt
          md5sum -c checksums-md5.txt
          sha1sum -c checksums-sha1.txt

      - name: Upload debug APK and checksums
        uses: actions/upload-artifact@v4
        with:
          name: DailyDiet-debug-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: |
            dist/DailyDiet-*.apk
            dist/checksums-md5.txt
            dist/checksums-sha1.txt
          if-no-files-found: error

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]{8}$ ]]; then
            echo "::error::Release tag must match vMAJOR.MINOR.yyyyMMdd, for example v1.0.20261005."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=${version##*.}0" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured; skipping signed release build."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"

      - name: Assemble release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleRelease
          -PdailyDiet.versionName=${{ steps.version.outputs.name }}
          -PdailyDiet.versionCode=${{ steps.version.outputs.code }}
          --stacktrace

      - name: Collect release artifacts
        if: steps.signing.outputs.configured == 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)"
          if [ -z "$apk" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          cp "$apk" "dist/DailyDiet-${APP_VERSION}.apk"
          cd dist
          md5sum DailyDiet-*.apk > checksums-md5.txt
          sha1sum DailyDiet-*.apk > checksums-sha1.txt
          md5sum -c checksums-md5.txt
          sha1sum -c checksums-sha1.txt

      - name: Upload release APK and checksums
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DailyDiet-release-${{ steps.version.outputs.name }}
          path: |
            dist/DailyDiet-*.apk
            dist/checksums-md5.txt
            dist/checksums-sha1.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" \
              dist/DailyDiet-*.apk dist/checksums-md5.txt dist/checksums-sha1.txt \
              --clobber
          else
            gh release create "$TAG_NAME" \
              dist/DailyDiet-*.apk dist/checksums-md5.txt dist/checksums-sha1.txt \
              --title "DailyDiet $APP_VERSION" \
              --generate-notes
          fi
